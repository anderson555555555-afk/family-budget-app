<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <meta name="referrer" content="no-referrer">

  <title>Семейный бюджет</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      padding-bottom: 35px;
      background: var(--tg-theme-bg-color, #f3f4f6);
      color: var(--tg-theme-text-color, #222);
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      font-size: 25px;
      margin: 8px 0 5px;
    }

    .period {
      color: var(--tg-theme-hint-color, #888);
      font-size: 14px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--tg-theme-secondary-bg-color, #fff);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .main-card {
      background: #246bfd;
      color: white;
    }

    .label {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 7px;
    }

    .total {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .available {
      font-size: 25px;
      font-weight: 700;
    }

    h2 {
      font-size: 19px;
      margin: 22px 0 12px;
    }

    .category {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid var(--tg-theme-hint-color, #ddd);
    }

    .category:last-child {
      border-bottom: none;
    }

    .category-name {
      font-weight: 600;
      font-size: 15px;
    }

    .category-spent {
      color: var(--tg-theme-hint-color, #888);
      font-size: 12px;
      margin-top: 4px;
    }

    .category-balance {
      font-weight: 700;
      font-size: 17px;
      white-space: nowrap;
    }

    .primary-button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, white);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    .primary-button:disabled {
      opacity: 0.5;
    }

    .secondary-button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      background: var(--tg-theme-secondary-bg-color, #ddd);
      color: var(--tg-theme-text-color, #222);
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    .secondary-button:disabled {
      opacity: 0.5;
    }

    .danger-button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      background: #ffe5e5;
      color: #a00000;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    .danger-button:disabled {
      opacity: 0.5;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 11px;
      border: 1px solid var(--tg-theme-hint-color, #ccc);
      background: var(--tg-theme-bg-color, white);
      color: var(--tg-theme-text-color, #222);
      font-size: 16px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--tg-theme-button-color, #2481cc);
    }

    .history-item {
      padding: 13px 0;
      border-bottom: 1px solid var(--tg-theme-hint-color, #ddd);
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: 600;
    }

    .history-description {
      overflow-wrap: anywhere;
    }

    .history-amount {
      white-space: nowrap;
    }

    .history-info {
      color: var(--tg-theme-hint-color, #888);
      font-size: 12px;
      margin-top: 5px;
    }

    .empty {
      color: var(--tg-theme-hint-color, #888);
      text-align: center;
      padding: 18px 0;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    .message {
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      margin-top: 12px;
      display: none;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      background: #ffe5e5;
      color: #a00000;
    }

    .message.success {
      display: block;
      background: #e0f5e7;
      color: #126b32;
    }

    .loading {
      text-align: center;
      padding: 35px 10px;
      color: var(--tg-theme-hint-color, #888);
    }

    .form-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    /* БАНКОВСКИЕ УВЕДОМЛЕНИЯ */

    .pending-card {
      border: 1px solid var(--tg-theme-hint-color, #ddd);
      border-radius: 13px;
      padding: 15px;
      margin-bottom: 13px;
    }

    .pending-card:last-child {
      margin-bottom: 0;
    }

    .pending-title {
      font-size: 16px;
      font-weight: 700;
      overflow-wrap: anywhere;
      margin-bottom: 6px;
    }

    .pending-date {
      font-size: 12px;
      color: var(--tg-theme-hint-color, #888);
      margin-bottom: 12px;
    }

    .pending-notification {
      background: var(--tg-theme-bg-color, #f3f4f6);
      border-radius: 9px;
      padding: 11px;
      margin-bottom: 14px;
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .pending-notification-title {
      font-size: 12px;
      color: var(--tg-theme-hint-color, #888);
      margin-bottom: 5px;
    }

    .pending-card .form-group {
      margin-bottom: 12px;
    }

    .pending-card .primary-button,
    .pending-card .secondary-button,
    .pending-card .danger-button {
      margin-top: 8px;
    }

    .pending-status-message {
      min-height: 0;
    }

  </style>
</head>

<body>

<div class="container">

  <div id="loading" class="loading">
    Подключаемся к семейному бюджету...
  </div>

  <div id="app" class="hidden">

    <h1>Семейный бюджет</h1>

    <div class="period" id="period"></div>

    <div class="card main-card">

      <div class="label">Всего в бюджете</div>

      <div class="total" id="total">0 ₽</div>

      <div class="label">Доступно для расходов</div>

      <div class="available" id="available">0 ₽</div>

    </div>


    <h2>Мои категории</h2>

    <div class="card" id="categories"></div>


    <!-- БАНКОВСКИЕ УВЕДОМЛЕНИЯ -->

    <h2>Ожидают подтверждения</h2>

    <div class="card" id="pending"></div>


    <button
      class="primary-button"
      onclick="showExpenseForm()">
      ＋ Добавить расход
    </button>


    <div id="expenseForm" class="card hidden" style="margin-top:16px;">

      <div class="form-title">
        Новый расход
      </div>

      <form id="expenseFormElement">

        <div class="form-group">

          <label for="expenseAmount">
            Сумма, ₽
          </label>

          <input
            id="expenseAmount"
            type="number"
            min="0.01"
            max="10000000"
            step="0.01"
            placeholder="Например, 1500"
            required>

        </div>


        <div class="form-group">

          <label for="expenseDescription">
            Что купили?
          </label>

          <input
            id="expenseDescription"
            type="text"
            maxlength="150"
            placeholder="Например, продукты в магазине"
            required>

        </div>


        <div class="form-group">

          <label for="expenseCategory">
            Категория
          </label>

          <select id="expenseCategory" required>

            <option value="Продукты">
              🛒 Продукты
            </option>

            <option value="Дни рождения">
              🎂 Дни рождения
            </option>

            <option value="Выходные">
              🎉 Выходные
            </option>

            <option value="Прочее">
              📦 Прочее
            </option>

          </select>

        </div>


        <button
          type="submit"
          id="saveExpenseButton"
          class="primary-button">

          Сохранить расход

        </button>

        <button
          type="button"
          class="secondary-button"
          onclick="hideExpenseForm()">

          Отмена

        </button>

      </form>

      <div id="formMessage" class="message"></div>

    </div>


    <h2>История расходов</h2>

    <div class="card" id="history"></div>

  </div>

</div>


<script>

// ======================================================
// НАСТРОЙКИ
// ======================================================

const API_URL =
  'https://script.google.com/macros/s/AKfycbzJBSis87N7r5eRKk9LCQJgsDL3yZ_IAog7oEtC3R7zk4Iwn8bItBEDJylQbo2atrg2dw/exec';

const tg = window.Telegram.WebApp;

let currentData = null;
let requestInProgress = false;
let pendingRequests = {};


// ======================================================
// TELEGRAM
// ======================================================

tg.ready();
tg.expand();

if (tg.setHeaderColor) {
  tg.setHeaderColor('bg_color');
}

if (tg.setBackgroundColor) {
  tg.setBackgroundColor('bg_color');
}


// ======================================================
// ФОРМАТИРОВАНИЕ СУММ
// ======================================================

function formatMoney(value) {

  return Number(value || 0).toLocaleString('ru-RU', {
    maximumFractionDigits: 2
  }) + ' ₽';

}


// ======================================================
// JSONP API
// ======================================================

function callApi(action, extra = {}) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      'budgetCallback_' +
      Date.now() +
      '_' +
      Math.floor(Math.random() * 100000);

    const params = new URLSearchParams();

    params.set('api', '1');
    params.set('action', action);
    params.set('initData', tg.initData || '');
    params.set('callback', callbackName);

    Object.keys(extra).forEach(function(key) {

      params.set(key, String(extra[key]));

    });

    const script = document.createElement('script');

    let finished = false;

    const timeout = setTimeout(function() {

      finish(new Error('Сервер не ответил. Попробуй ещё раз.'));

    }, 25000);


    function finish(error, result) {

      if (finished) return;

      finished = true;

      clearTimeout(timeout);

      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      if (error) {
        reject(error);
      } else {
        resolve(result);
      }

    }


    window[callbackName] = function(result) {

      finish(null, result);

    };

    script.onerror = function() {

      finish(new Error('Не удалось связаться с сервером'));

    };

    script.src =
      API_URL + '?' + params.toString();

    document.body.appendChild(script);

  });

}


// ======================================================
// ПОКАЗ ОШИБКИ ЗАГРУЗКИ
// ======================================================

function showLoadingError(message) {

  document.getElementById('loading').textContent =
    'Ошибка: ' + message;

}


// ======================================================
// АВТОРИЗАЦИЯ И ЗАГРУЗКА
// ======================================================

async function startApp() {

  try {

    if (!tg.initData) {
      throw new Error(
        'Открой приложение через Telegram'
      );
    }

    const auth = await callApi('auth');

    if (!auth.success) {
      throw new Error(auth.error);
    }

    const response = await callApi('getData');

    if (!response.success) {
      throw new Error(response.error);
    }

    renderData(response.data);

    document.getElementById('loading').classList.add('hidden');

    document.getElementById('app').classList.remove('hidden');

  } catch (error) {

    showLoadingError(error.message || String(error));

  }

}


// ======================================================
// ОТОБРАЖЕНИЕ ДАННЫХ
// ======================================================

function renderData(data) {

  currentData = data;

  document.getElementById('period').textContent =
    'Период: ' + data.period;

  document.getElementById('total').textContent =
    formatMoney(data.total);

  document.getElementById('available').textContent =
    formatMoney(data.available);


  renderCategories(data.categories);

  renderPending(data.pending || []);

  renderHistory(data.history || []);

}


// ======================================================
// КАТЕГОРИИ
// ======================================================

function renderCategories(categories) {

  const container = document.getElementById('categories');

  const items = [

    {
      key: 'products',
      name: '🛒 Продукты',
      title: 'Продукты'
    },

    {
      key: 'birthdays',
      name: '🎂 Дни рождения',
      title: 'Дни рождения'
    },

    {
      key: 'weekends',
      name: '🎉 Выходные',
      title: 'Выходные'
    },

    {
      key: 'other',
      name: '📦 Прочее',
      title: 'Прочее'
    }

  ];

  container.innerHTML = '';

  items.forEach(function(item) {

    const category = categories[item.key] || {
      balance: 0,
      spent: 0
    };

    const row = document.createElement('div');

    row.className = 'category';

    const left = document.createElement('div');

    const name = document.createElement('div');

    name.className = 'category-name';

    name.textContent = item.name;

    const spent = document.createElement('div');

    spent.className = 'category-spent';

    spent.textContent =
      'Потрачено: ' + formatMoney(category.spent);

    left.appendChild(name);

    left.appendChild(spent);


    const balance = document.createElement('div');

    balance.className = 'category-balance';

    balance.textContent = formatMoney(category.balance);

    row.appendChild(left);

    row.appendChild(balance);

    container.appendChild(row);

  });

}


// ======================================================
// БАНКОВСКИЕ УВЕДОМЛЕНИЯ
// ======================================================

function renderPending(pending) {

  const container = document.getElementById('pending');

  container.innerHTML = '';

  if (!pending.length) {

    const empty = document.createElement('div');

    empty.className = 'empty';

    empty.textContent =
      'Нет операций, ожидающих подтверждения.';

    container.appendChild(empty);

    return;

  }


  pending.forEach(function(operation) {

    const card = document.createElement('div');

    card.className = 'pending-card';


    // Название операции

    const title = document.createElement('div');

    title.className = 'pending-title';

    title.textContent =
      operation.description || 'Банковская покупка';


    // Дата

    const date = document.createElement('div');

    date.className = 'pending-date';

    date.textContent =
      operation.date || 'Дата не указана';


    // Исходный текст уведомления

    const notificationTitle = document.createElement('div');

    notificationTitle.className = 'pending-notification-title';

    notificationTitle.textContent =
      'Текст банковского уведомления';


    const notification = document.createElement('div');

    notification.className = 'pending-notification';

    notification.textContent =
      operation.rawText || 'Текст уведомления отсутствует';


    // Поле суммы

    const amountGroup = document.createElement('div');

    amountGroup.className = 'form-group';

    const amountLabel = document.createElement('label');

    amountLabel.textContent = 'Сумма, ₽';

    const amountInput = document.createElement('input');

    amountInput.type = 'number';

    amountInput.min = '0.01';

    amountInput.max = '10000000';

    amountInput.step = '0.01';

    amountInput.value =
      Number(operation.amount) > 0
        ? operation.amount
        : '';

    amountInput.placeholder = 'Укажи сумму покупки';


    amountGroup.appendChild(amountLabel);

    amountGroup.appendChild(amountInput);


    // Поле категории

    const categoryGroup = document.createElement('div');

    categoryGroup.className = 'form-group';

    const categoryLabel = document.createElement('label');

    categoryLabel.textContent = 'Категория';

    const categorySelect = document.createElement('select');

    const categoryOptions = [

      {
        value: 'Продукты',
        text: '🛒 Продукты'
      },

      {
        value: 'Дни рождения',
        text: '🎂 Дни рождения'
      },

      {
        value: 'Выходные',
        text: '🎉 Выходные'
      },

      {
        value: 'Прочее',
        text: '📦 Прочее'
      }

    ];

    categoryOptions.forEach(function(option) {

      const element = document.createElement('option');

      element.value = option.value;

      element.textContent = option.text;

      categorySelect.appendChild(element);

    });

    categorySelect.value =
      categoryOptions.some(function(item) {
        return item.value === operation.category;
      })
        ? operation.category
        : 'Прочее';


    categoryGroup.appendChild(categoryLabel);

    categoryGroup.appendChild(categorySelect);


    // Сообщение операции

    const message = document.createElement('div');

    message.className = 'message pending-status-message';


    // Кнопка сохранения

    const saveButton = document.createElement('button');

    saveButton.type = 'button';

    saveButton.className = 'secondary-button';

    saveButton.textContent = 'Сохранить изменения';


    // Кнопка подтверждения

    const confirmButton = document.createElement('button');

    confirmButton.type = 'button';

    confirmButton.className = 'primary-button';

    confirmButton.textContent = '✓ Подтвердить расход';


    // Кнопка отмены

    const cancelButton = document.createElement('button');

    cancelButton.type = 'button';

    cancelButton.className = 'danger-button';

    cancelButton.textContent = 'Отменить операцию';


    // Собираем карточку

    card.appendChild(title);

    card.appendChild(date);

    card.appendChild(notificationTitle);

    card.appendChild(notification);

    card.appendChild(amountGroup);

    card.appendChild(categoryGroup);

    card.appendChild(message);

    card.appendChild(saveButton);

    card.appendChild(confirmButton);

    card.appendChild(cancelButton);


    container.appendChild(card);


    // Сохранение изменений

    saveButton.addEventListener('click', async function() {

      await savePendingOperation(
        operation.id,
        amountInput,
        categorySelect,
        message,
        saveButton,
        confirmButton,
        cancelButton
      );

    });


    // Подтверждение расхода

    confirmButton.addEventListener('click', async function() {

      await confirmPendingOperation(
        operation.id,
        amountInput,
        categorySelect,
        message,
        saveButton,
        confirmButton,
        cancelButton
      );

    });


    // Отмена операции

    cancelButton.addEventListener('click', async function() {

      await cancelPendingOperation(
        operation.id,
        message,
        saveButton,
        confirmButton,
        cancelButton
      );

    });

  });

}


// ======================================================
// БЛОКИРОВКА КНОПОК ОПЕРАЦИИ
// ======================================================

function setPendingButtonsDisabled(
  operationId,
  disabled,
  saveButton,
  confirmButton,
  cancelButton
) {

  pendingRequests[operationId] = disabled;

  saveButton.disabled = disabled;

  confirmButton.disabled = disabled;

  cancelButton.disabled = disabled;

}


// ======================================================
// СООБЩЕНИЕ В КАРТОЧКЕ ОПЕРАЦИИ
// ======================================================

function showPendingMessage(element, message, type) {

  element.textContent = message;

  element.className = 'message pending-status-message ' + type;

}


// ======================================================
// ПРОВЕРКА СУММЫ ОЖИДАЮЩЕЙ ОПЕРАЦИИ
// ======================================================

function getPendingAmount(input) {

  const amount = Number(input.value);

  if (
    !Number.isFinite(amount) ||
    amount <= 0 ||
    amount > 10000000
  ) {

    throw new Error(
      'Введи корректную сумму больше нуля.'
    );

  }

  return amount;

}


// ======================================================
// СОХРАНЕНИЕ ИЗМЕНЕНИЙ ОЖИДАЮЩЕЙ ОПЕРАЦИИ
// ======================================================

async function savePendingOperation(
  operationId,
  amountInput,
  categorySelect,
  message,
  saveButton,
  confirmButton,
  cancelButton
) {

  if (pendingRequests[operationId]) return;

  let amount;

  try {

    amount = getPendingAmount(amountInput);

  } catch (error) {

    showPendingMessage(
      message,
      error.message,
      'error'
    );

    return;

  }

  const category = categorySelect.value;

  setPendingButtonsDisabled(
    operationId,
    true,
    saveButton,
    confirmButton,
    cancelButton
  );

  saveButton.textContent = 'Сохраняем...';

  try {

    const response = await callApi('updatePending', {

      operationId: operationId,

      amount: amount,

      category: category

    });

    if (!response.success) {

      throw new Error(response.error);

    }

    if (!response.data) {

      throw new Error(
        'Изменения сохранены, но не удалось обновить экран.'
      );

    }

    renderData(response.data);

    if (tg.HapticFeedback) {
      tg.HapticFeedback.notificationOccurred('success');
    }

  } catch (error) {

    showPendingMessage(
      message,
      error.message || String(error),
      'error'
    );

  } finally {

    pendingRequests[operationId] = false;

    saveButton.textContent = 'Сохранить изменения';

    saveButton.disabled = false;

    confirmButton.disabled = false;

    cancelButton.disabled = false;

  }

}


// ======================================================
// ПОДТВЕРЖДЕНИЕ ОЖИДАЮЩЕЙ ОПЕРАЦИИ
// ======================================================

async function confirmPendingOperation(
  operationId,
  amountInput,
  categorySelect,
  message,
  saveButton,
  confirmButton,
  cancelButton
) {

  if (pendingRequests[operationId]) return;

  let amount;

  try {

    amount = getPendingAmount(amountInput);

  } catch (error) {

    showPendingMessage(
      message,
      error.message,
      'error'
    );

    return;

  }

  const category = categorySelect.value;

  const confirmed = window.confirm(
    'Подтвердить расход ' +
    formatMoney(amount) +
    ' из категории «' +
    category +
    '»?'
  );

  if (!confirmed) return;


  setPendingButtonsDisabled(
    operationId,
    true,
    saveButton,
    confirmButton,
    cancelButton
  );

  confirmButton.textContent = 'Подтверждаем...';

  try {

    // СНАЧАЛА СОХРАНЯЕМ ИЗМЕНЁННУЮ СУММУ И КАТЕГОРИЮ

    const updateResponse = await callApi('updatePending', {

      operationId: operationId,

      amount: amount,

      category: category

    });

    if (!updateResponse.success) {

      throw new Error(updateResponse.error);

    }


    // ТОЛЬКО ПОСЛЕ СОХРАНЕНИЯ ПОДТВЕРЖДАЕМ РАСХОД

    const confirmResponse = await callApi('confirmPending', {

      operationId: operationId,

      category: category

    });

    if (!confirmResponse.success) {

      throw new Error(confirmResponse.error);

    }

    if (!confirmResponse.data) {

      throw new Error(
        'Расход обработан, но не удалось обновить экран. Перезагрузи приложение.'
      );

    }


    renderData(confirmResponse.data);

    if (tg.HapticFeedback) {
      tg.HapticFeedback.notificationOccurred('success');
    }

    if (tg.showPopup) {

      tg.showPopup({

        title: 'Расход подтверждён',

        message:
          'Сумма: ' + formatMoney(amount) +
          '\nКатегория: ' + category,

        buttons: [
          {
            type: 'ok'
          }
        ]

      });

    }

  } catch (error) {

    showPendingMessage(
      message,
      error.message || String(error),
      'error'
    );

    if (tg.HapticFeedback) {
      tg.HapticFeedback.notificationOccurred('error');
    }

  } finally {

    pendingRequests[operationId] = false;

    confirmButton.textContent = '✓ Подтвердить расход';

    saveButton.disabled = false;

    confirmButton.disabled = false;

    cancelButton.disabled = false;

  }

}


// ======================================================
// ОТМЕНА ОЖИДАЮЩЕЙ ОПЕРАЦИИ
// ======================================================

async function cancelPendingOperation(
  operationId,
  message,
  saveButton,
  confirmButton,
  cancelButton
) {

  if (pendingRequests[operationId]) return;

  const confirmed = window.confirm(
    'Отменить это банковское уведомление?\n\nДеньги из бюджета списаны не будут.'
  );

  if (!confirmed) return;


  setPendingButtonsDisabled(
    operationId,
    true,
    saveButton,
    confirmButton,
    cancelButton
  );

  cancelButton.textContent = 'Отменяем...';

  try {

    const response = await callApi('cancelPending', {

      operationId: operationId

    });

    if (!response.success) {

      throw new Error(response.error);

    }

    if (!response.data) {

      throw new Error(
        'Операция отменена, но не удалось обновить экран.'
      );

    }

    renderData(response.data);

    if (tg.HapticFeedback) {
      tg.HapticFeedback.notificationOccurred('success');
    }

  } catch (error) {

    showPendingMessage(
      message,
      error.message || String(error),
      'error'
    );

  } finally {

    pendingRequests[operationId] = false;

    cancelButton.textContent = 'Отменить операцию';

    saveButton.disabled = false;

    confirmButton.disabled = false;

    cancelButton.disabled = false;

  }

}


// ======================================================
// ИСТОРИЯ РАСХОДОВ
// ======================================================

function renderHistory(history) {

  const container = document.getElementById('history');

  container.innerHTML = '';

  if (!history.length) {

    const empty = document.createElement('div');

    empty.className = 'empty';

    empty.textContent = 'Операций пока нет.';

    container.appendChild(empty);

    return;

  }

  history.forEach(function(item) {

    const row = document.createElement('div');

    row.className = 'history-item';


    const top = document.createElement('div');

    top.className = 'history-top';


    const description = document.createElement('div');

    description.className = 'history-description';

    description.textContent = item.description;


    const amount = document.createElement('div');

    amount.className = 'history-amount';

    amount.textContent = '− ' + formatMoney(item.amount);


    top.appendChild(description);

    top.appendChild(amount);


    const info = document.createElement('div');

    info.className = 'history-info';

    info.textContent =
      item.category + ' · ' + item.date;


    row.appendChild(top);

    row.appendChild(info);

    container.appendChild(row);

  });

}


// ======================================================
// ПОКАЗ ФОРМЫ
// ======================================================

function showExpenseForm() {

  const form = document.getElementById('expenseForm');

  form.classList.remove('hidden');

  document.getElementById('formMessage').className = 'message';

  document.getElementById('expenseAmount').focus();

  form.scrollIntoView({
    behavior: 'smooth',
    block: 'start'
  });

}


// ======================================================
// СКРЫТИЕ ФОРМЫ
// ======================================================

function hideExpenseForm() {

  if (requestInProgress) return;

  document.getElementById('expenseForm').classList.add('hidden');

  document.getElementById('expenseFormElement').reset();

  document.getElementById('formMessage').className = 'message';

}


// ======================================================
// СООБЩЕНИЕ В ФОРМЕ
// ======================================================

function showFormMessage(message, type) {

  const element = document.getElementById('formMessage');

  element.textContent = message;

  element.className = 'message ' + type;

}


// ======================================================
// СОХРАНЕНИЕ РАСХОДА
// ======================================================

document.getElementById('expenseFormElement')
  .addEventListener('submit', async function(event) {

    event.preventDefault();

    if (requestInProgress) return;

    const amount = Number(
      document.getElementById('expenseAmount').value
    );

    const description =
      document.getElementById('expenseDescription').value.trim();

    const category =
      document.getElementById('expenseCategory').value;


    if (!Number.isFinite(amount) || amount <= 0) {

      showFormMessage(
        'Введи корректную сумму.',
        'error'
      );

      return;

    }

    if (!description) {

      showFormMessage(
        'Напиши, что было куплено.',
        'error'
      );

      return;

    }

    const button =
      document.getElementById('saveExpenseButton');

    requestInProgress = true;

    button.disabled = true;

    button.textContent = 'Сохраняем...';


    try {

      const requestId =
        'expense_' +
        Date.now() +
        '_' +
        Math.floor(Math.random() * 1000000000);

      const response = await callApi('addExpense', {

        amount: amount,

        description: description,

        category: category,

        requestId: requestId

      });


      if (!response.success) {

        throw new Error(response.error);

      }


      if (!response.data) {

        throw new Error(
          'Расход сохранён, но не удалось получить обновлённый бюджет. Обнови экран.'
        );

      }


      renderData(response.data);


      document.getElementById('expenseFormElement').reset();

      document.getElementById('expenseForm').classList.add('hidden');


      if (tg.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }

      tg.showPopup({

        title: 'Расход сохранён',

        message:
          'Сумма: ' + formatMoney(amount) +
          '\nКатегория: ' + category,

        buttons: [
          {
            type: 'ok'
          }
        ]

      });


    } catch (error) {

      showFormMessage(
        error.message || String(error),
        'error'
      );

      if (tg.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('error');
      }

    } finally {

      requestInProgress = false;

      button.disabled = false;

      button.textContent = 'Сохранить расход';

    }

  });


// ======================================================
// ЗАПУСК
// ======================================================

startApp();

</script>
